# XcodeGen spec for the MedPull patient app. Regenerate the .xcodeproj with
# `make ios` (or `xcodegen generate` here); the project file is derived and
# not committed.
#
# The Vital (Junction) SDK comes from the sibling checkout ../../vital-ios —
# the "vital wrapper" this app grew out of. To build against the published
# package instead, replace the `path:` line with:
#   url: https://github.com/tryvital/vital-ios
#   from: 1.9.0
name: MedPull
options:
  bundleIdPrefix: com.medpull
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  VitalSDK:
    path: ../../vital-ios
targets:
  MedPull:
    type: application
    platform: iOS
    sources:
      - path: MedPull
        excludes:
          - "Info.plist"
          # The four EB Garamond TTFs are 1.53 MB of typeface the app stopped
          # using long ago, and `sources: - path:
          # MedPull` was still sweeping them into the bundle as resources —
          # unregistered from UIAppFonts, so they loaded nothing and shipped
          # anyway (confirmed in the built MedPull.app). Excluding them here
          # stops the COPY; the files stay on disk, along with their OFL.txt,
          # so a future decision to bring the face back is one line.
          - "Resources/Fonts/EBGaramond-*.ttf"
          # OFL.txt is EB Garamond's licence and goes with those files. The
          # licence that must still ship is OFL-Outfit.txt, which the blanket
          # sources rule above continues to pick up — SIL OFL 1.1 requires it
          # to accompany the cuts that DO ship.
          - "Resources/Fonts/OFL.txt"
    # XcodeGen (re)writes both files from these properties on every
    # `generate`, so this spec — not the files — is the source of truth.
    info:
      path: MedPull/Info.plist
      properties:
        CFBundleDisplayName: MedPull
        MedPullAPIBaseURL: $(MEDPULL_API_BASE_URL)
        # The bundled typeface. XcodeGen rewrites Info.plist from this
        # spec on every generate, so the key has to live here — added to the
        # plist directly it would vanish on the next `make ios`. The files
        # sit in MedPull/Resources/Fonts and are picked up as resources by
        # the `sources: - path: MedPull` rule above.
        #
        # Outfit (SIL OFL 1.1), the medpull.org face, as static instances of
        # the variable master (fontTools.varLib.instancer, the foundry's
        # wordmark ligatures removed): 200 and 300 for display type and big
        # numbers, 400 body, 500 titles and labels, and 600, which ships ONLY
        # as the Bold Text step for 500 (MPFont.name(for:bold:)). The names
        # here are filenames; UI/Theme.swift asks for the PostScript names
        # Outfit-ExtraLight / -Light / -Regular / -Medium / -SemiBold.
        UIAppFonts:
          - Outfit-ExtraLight.ttf
          - Outfit-Light.ttf
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.medpull.recovery
            CFBundleURLSchemes: [medpull]
        # The launch screen is the canvas (#FBFBF9 / #0B0B0C) with the mark,
        # so the first frame already looks like the app.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: MedPull shares your activity, sleep, heart and walking data with your care team so they can follow your recovery between visits.
        NSHealthUpdateUsageDescription: MedPull does not write to Health, but the Health SDK it uses declares this capability.
        NSMicrophoneUsageDescription: Talk to MedPull instead of typing — the microphone is only on while you hold the button.
        NSSpeechRecognitionUsageDescription: MedPull turns what you say into text so it can log your pain, mark tasks done, or pass a note to your care team.
        BGTaskSchedulerPermittedIdentifiers: [io.tryvital.VitalHealthKit.ProcessingTask]
        UIBackgroundModes: [processing]
        # Development builds talk to `make dev` over plain http (localhost, or
        # the Mac's LAN address from a phone). Drop this for a store build.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: MedPull/MedPull.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - package: VitalSDK
        product: VitalCore
      - package: VitalSDK
        product: VitalHealthKit
    # In-App Purchase needs no entitlement key on iOS; the products are
    # defined in App Store Connect, and locally in MedPull.storekit (wired to
    # the scheme below so a simulator run can buy them).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medpull.recovery
        PRODUCT_NAME: MedPull
        DEVELOPMENT_TEAM: 2DFDVFGSH3
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        # Where the app talks to. Override per configuration, or change it in
        # the app's Profile screen (stored on device) — e.g. your Mac's LAN
        # address when running on a real phone against `make dev`.
        MEDPULL_API_BASE_URL: "https://d1msmt8r5u7oxx.cloudfront.net"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
schemes:
  MedPull:
    build:
      targets:
        MedPull: all
    run:
      config: Debug
      # Local StoreKit testing: the two MedPull Personal subscriptions, signed
      # by Xcode. The backend accepts those in its lenient mode
      # (APPLE_SUBSCRIPTION_VERIFY=lenient); a strict server refuses them and
      # the account runs on its trial instead.
      storeKitConfiguration: MedPull.storekit
    archive:
      config: Release
