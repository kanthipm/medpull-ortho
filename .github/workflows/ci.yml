name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv sync --all-groups
      - run: cd backend && uv run ruff check app tests
      - run: cd backend && uv run pytest -q
      # The committed OpenAPI export is the contract the patient apps are
      # generated against; the suite above already fails when it is stale,
      # and this prints the diff so the fix is obvious.
      - run: cd backend && uv run python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
