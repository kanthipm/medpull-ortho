<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" fill="none">
  <!-- MedPull mark. Shapes, coordinates, stroke widths and proportions are
       untouched; only the three fills changed. They were #90caf9 / #80deea /
       #26c6da (Material Blue 200 and Cyan 200/400, no declared token among
       them), drawn for the Medical Blue app bar that no longer exists: on the
       white bar that replaced it they measured 1.750 / 1.549 / 2.064:1, under
       the 3:1 graphic floor three times over.
       The bar is the panel token now (#FFFFFF light, #141C24 dark) and one
       img element cannot re-colour per theme, so every fill has to clear 3:1
       on BOTH grounds at once. That confines them to relative luminance
       between 0.134 and 0.300, which rules the Teal ANCHOR #00ACC1 out
       (luminance 0.330, only 2.765:1 on white). The teal here is therefore
       the teal-graphic token, which is the one declared for strokes and
       accent bars.
         #4a90d9  chart-seq-3     3.343 on white   5.144 on #141C24
         #0097a7  teal-graphic    3.509            4.900
         #1976d2  brand           4.602            3.736
       The wedge is the only shape either figure touches (the heads clear each
       other by ~54px and the wedge covers the whole body contact zone): it is
       1.377:1 against the blue figure and 1.311:1 against the teal one, near
       the arithmetic maximum for three fills inside a 1.85:1 luminance window.
       DO NOT write a double hyphen in this comment. XML forbids it inside a
       comment and Chrome then renders the whole mark at zero width, which is
       exactly how the first draft of this file shipped nothing at all. -->
  <circle cx="186" cy="64" r="44" fill="#4a90d9"/>
  <path d="M186 168 L104 376 L270 376 Z" stroke="#4a90d9" stroke-width="112"
        stroke-linejoin="round" fill="#4a90d9"/>
  <circle cx="308" cy="88" r="42" fill="#0097a7"/>
  <path d="M308 196 L236 380 L382 380 Z" stroke="#0097a7" stroke-width="110"
        stroke-linejoin="round" fill="#0097a7"/>
  <path d="M253 185 L322 355 A56 56 0 0 1 270 432 L218 432 A55 55 0 0 1 185 360 Z"
        fill="#1976d2"/>
</svg>
