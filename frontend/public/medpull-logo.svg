<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" fill="none">
  <!-- MedPull mark: two figures, light blue + light teal, teal where they overlap. -->
  <!-- blue person -->
  <circle cx="186" cy="64" r="44" fill="#90caf9"/>
  <path d="M186 168 L104 376 L270 376 Z" stroke="#90caf9" stroke-width="112"
        stroke-linejoin="round" fill="#90caf9"/>
  <!-- teal person -->
  <circle cx="308" cy="88" r="42" fill="#80deea"/>
  <path d="M308 196 L236 380 L382 380 Z" stroke="#80deea" stroke-width="110"
        stroke-linejoin="round" fill="#80deea"/>
  <!-- teal overlap (intersection of the two bodies) -->
  <path d="M253 185 L322 355 A56 56 0 0 1 270 432 L218 432 A55 55 0 0 1 185 360 Z"
        fill="#26c6da"/>
</svg>
