<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color follows the canvas: #FBFBF9 light / #0B0B0C dark. The
         pre-paint script below rewrites it before the first frame and
         src/lib/ThemeProvider.tsx keeps it in sync after. -->
    <meta name="theme-color" content="#fbfbf9" />
    <link rel="icon" type="image/png" href="/medpull-mark.png" />
    <link rel="apple-touch-icon" href="/medpull-mark.png" />

    <!-- Outfit (SIL OFL 1.1), the medpull.org face: one variable file for
         every weight, so one preload covers the whole first paint. -->
    <link
      rel="preload"
      href="/fonts/Outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Light is the default. Dark applies only when the clinician chose it
         ('medpull-theme-choice', written by the theme toggle and Settings),
         so the first paint never flashes the wrong mode. The glass kill
         switch is applied here too, so a clinician who turned it off never
         sees one frame of blur. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('medpull-theme-choice') === 'dark' ? 'dark' : 'light'
          if (t === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'dark' ? '#0b0b0c' : '#fbfbf9')
          document.documentElement.style.background = t === 'dark' ? '#0b0b0c' : '#fbfbf9'
          if (localStorage.getItem('medpull-glass') === 'off') {
            document.documentElement.setAttribute('data-glass', 'off')
          }
        } catch (e) {}
      })()
    </script>
    <title>MedPull · Recovery Copilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
